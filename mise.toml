# ============================================
# TOOLS
# ============================================
[tools]
node = "24"
pnpm = "12"

# ============================================
# ENVIRONMENT
# ============================================
[env]
_.file = [".env"]

# ============================================
# DEVELOPMENT
# ============================================
[tasks."dev"]
description = "Run both workers + web in workerd (alchemy dev)"
run = "alchemy dev"

[tasks."dev:ui"]
description = "Run web dev server (vite) against the running alchemy dev worker"
dir = "apps/web"
run = "pnpm dev"
alias = "dev-ui"

# ============================================
# CODE QUALITY
# ============================================
[tasks."lint"]
description = "Lint (oxlint + anti-slop)"
run = "pnpm lint"

[tasks."lint:fix"]
description = "Lint and autofix (oxlint)"
run = "pnpm lint:fix"

[tasks."format"]
description = "Format (oxfmt)"
run = "pnpm format"

[tasks."typecheck"]
description = "Typecheck all workspaces"
run = "pnpm typecheck"

[tasks."test"]
description = "Run unit tests (vitest)"
run = "pnpm test"

# ============================================
# BUILD
# ============================================
[tasks."build"]
description = "Build web SPA (required before deploy/dev)"
run = "pnpm build"

# ============================================
# DATABASE (D1)
# ============================================
[tasks."migrate:new"]
description = "Create new D1 migration (usage: mise run migrate:new name=your_migration)"
run = '''
#!/usr/bin/env bash
set -e
name="{{arg(name='migration')}}"
next=$(ls migrations/*.sql 2>/dev/null | sed 's|migrations/||; s|_.*||' | sort -n | tail -1)
next=$(printf "%04d" $((10#${next:-0000} + 1)))
file="migrations/${next}_${name}.sql"
touch "$file"
echo "Created $file"
'''
# Migrations are applied by alchemy (deploy, and `alchemy dev` against the local
# D1 simulator) from the `migrations` prop in infra/resources.ts — there is no
# separate apply/status command.

# ============================================
# DEPLOY
# ============================================
[tasks."deploy"]
description = "Build web + deploy the stack (stage: --stage or $ALCHEMY_STAGE)"
run = "pnpm deploy"

[tasks."plan"]
description = "Preview stack changes without applying"
run = "pnpm plan"

[tasks."destroy"]
description = "Delete every resource in the current stage"
run = "pnpm destroy"

# ============================================
# UTILITY
# ============================================
[tasks."setup"]
description = "First-time setup: install deps, build the SPA"
run = '''
#!/usr/bin/env bash
set -e
pnpm install
pnpm build
echo "Done. Auth with 'alchemy profile edit --add Cloudflare', then 'mise run dev'."
'''

[tasks."doctor"]
description = "Check environment"
run = '''
echo "node: $(node --version)"
echo "pnpm: $(pnpm --version)"
alchemy profile list || true
'''
