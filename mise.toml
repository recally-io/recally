# ============================================
# TOOLS
# ============================================
[tools]
node = "24"
pnpm = "12"
wrangler = "4"

# ============================================
# ENVIRONMENT
# ============================================
[env]
_.file = [".env"]

# ============================================
# DEVELOPMENT
# ============================================
[tasks."dev:api"]
description = "Run App Worker locally (wrangler dev)"
dir = "apps/api"
run = "wrangler dev"

[tasks."dev:jobs"]
description = "Run Jobs Worker locally (wrangler dev)"
dir = "apps/jobs"
run = "wrangler dev"

[tasks."dev:ui"]
description = "Run web dev server (vite)"
dir = "apps/web"
run = "pnpm dev"
alias = "dev-ui"

# ============================================
# CODE QUALITY
# ============================================
[tasks."lint"]
description = "Lint and format check (biome)"
run = "pnpm lint"

[tasks."lint:fix"]
description = "Lint and auto-fix (biome)"
run = "pnpm lint:fix"

[tasks."typecheck"]
description = "Typecheck all workspaces"
run = "pnpm typecheck"

[tasks."test"]
description = "Run unit tests (vitest)"
run = "pnpm test"

# ============================================
# BUILD
# ============================================
[tasks."build"]
description = "Build all workspaces"
run = "pnpm build"

# ============================================
# DATABASE (D1)
# ============================================
[tasks."migrate:new"]
description = "Create new D1 migration (usage: mise run migrate:new name=your_migration)"
run = '''
#!/usr/bin/env bash
set -e
name="{{arg(name='migration')}}"
next=$(ls migrations/*.sql 2>/dev/null | sed 's|migrations/||; s|_.*||' | sort -n | tail -1)
next=$(printf "%04d" $((10#${next:-0000} + 1)))
file="migrations/${next}_${name}.sql"
touch "$file"
echo "Created $file"
'''

[tasks."migrate:local"]
description = "Apply D1 migrations to local dev database"
dir = "apps/api"
run = "wrangler d1 migrations apply recally-dev --local"

[tasks."migrate:status"]
description = "Show local D1 migration status"
dir = "apps/api"
run = "wrangler d1 migrations list recally-dev --local"

# ============================================
# GENERATED TYPES
# ============================================
[tasks."types"]
description = "Regenerate worker-configuration.d.ts for app workers"
run = "pnpm types"

# ============================================
# DEPLOY
# ============================================
[tasks."deploy:jobs"]
description = "Deploy Jobs Worker"
dir = "apps/jobs"
run = "wrangler deploy"

[tasks."deploy:api"]
description = "Deploy App Worker (build web first)"
depends = ["build:ui"]
dir = "apps/api"
run = "wrangler deploy"

[tasks."build:ui"]
description = "Build web frontend"
dir = "apps/web"
run = "pnpm build"

# ============================================
# UTILITY
# ============================================
[tasks."setup"]
description = "First-time setup: install deps, apply local migrations, generate types"
run = '''
#!/usr/bin/env bash
set -e
pnpm install
pnpm types
mise run migrate:local
echo "Done. Run 'mise run dev:api' / 'dev:jobs' / 'dev:ui'."
'''

[tasks."doctor"]
description = "Check environment"
run = '''
echo "node: $(node --version)"
echo "pnpm: $(pnpm --version)"
echo "wrangler: $(wrangler --version)"
wrangler whoami || true
'''
