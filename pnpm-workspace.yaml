packages:
  - "apps/*"
  - "packages/*"

overrides:
  effect: 4.0.0-rc.112
  "@effect/platform": 4.0.0-rc.112
  "@effect/platform-node": 4.0.0-rc.112
  "@effect/platform-node-shared": 4.0.0-rc.112
  "@effect/vitest": 4.0.0-rc.112

onlyBuiltDependencies:
  - esbuild
  - workerd
  - protobufjs
allowBuilds:
  "@google/genai": false
  esbuild: true
  # Optional native accelerator for msgpackr; the JS fallback is sufficient.
  msgpackr-extract: false
  protobufjs: true
  workerd: true
